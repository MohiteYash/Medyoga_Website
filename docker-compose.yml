services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medyoga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [medyoga_pg:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  medyoga_pg:
